name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax (stdlib only)
        run: python3 -m py_compile ns-cgm-graph.py
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
